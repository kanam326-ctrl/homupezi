<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VS Code テトリス（機能追加版）</title>
    <style>
        body {
            background-color: #202028;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #score {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .game-container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }
        .side-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .panel-title {
            font-size: 14px;
            margin-bottom: 5px;
            color: #aaa;
        }
        canvas {
            border: solid 2px #fff;
            background-color: #000;
        }
        #holdCanvas {
            background-color: #111;
            border: solid 2px #555;
        }
        .info {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="score">SCORE: 0</div>
    
    <div class="game-container">
        <!-- ホールド画面 -->
        <div class="side-panel">
            <div class="panel-title">HOLD</div>
            <canvas id="holdCanvas" width="80" height="80"></canvas>
        </div>
        
        <!-- メイン画面 -->
        <canvas id="tetris" width="240" height="400"></canvas>
    </div>

    <div class="info">
        操作方法:<br>
        ◀ ▶ : 移動 / ▼ : ソフトドロップ / ▲ : 右回転<br>
        <strong>Space : ハードドロップ</strong> / <strong>Shift : ホールド</strong>
    </div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
context.scale(20, 20);

const holdCanvas = document.getElementById('holdCanvas');
const holdContext = holdCanvas.getContext('2d');
holdContext.scale(20, 20);

// ブロックの色定義
const colors = [
    null,
    '#FF0D73', // I
    '#0DC2FF', // L
    '#0DFF72', // J
    '#F538FF', // O
    '#FF8E0D', // Z
    '#FFE138', // S
    '#3877FF', // T
];

// ステージの作成
function createMatrix(w, h) {
    const matrix = [];
    while (h--) {
        matrix.push(new Array(w).fill(0));
    }
    return matrix;
}

// テトリミノの形状
function createPiece(type) {
    if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
    if (type === 'L') return [[0,2,0],[0,2,0],[0,2,2]];
    if (type === 'J') return [[0,3,0],[0,3,0],[3,3,0]];
    if (type === 'O') return [[4,4],[4,4]];
    if (type === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
    if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
    if (type === 'T') return [[0,7,0],[7,7,7],[0,0,0]];
}

// 衝突判定
function collide(arena, player) {
    const [m, o] = [player.matrix, player.pos];
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0 &&
               (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                return true;
            }
        }
    }
    return false;
}

// ライン消去
function arenaSweep() {
    let rowCount = 1;
    outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] === 0) continue outer;
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        player.score += rowCount * 10;
        rowCount *= 2;
    }
}

// 描画
function draw() {
    context.fillStyle = '#000';
    context.fillRect(0, 0, canvas.width, canvas.height);
    drawMatrix(context, arena, {x: 0, y: 0});
    drawMatrix(context, player.matrix, player.pos);
    drawHold();
}

function drawMatrix(ctx, matrix, offset) {
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                ctx.fillStyle = colors[value];
                ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
            }
        });
    });
}

// ホールド画面の描画
function drawHold() {
    holdContext.fillStyle = '#111';
    holdContext.fillRect(0, 0, holdCanvas.width, holdCanvas.height);
    if (holdPieceType) {
        const matrix = createPiece(holdPieceType);
        // 中央に寄せるためのオフセット計算
        const offsetX = (4 - matrix[0].length) / 2;
        const offsetY = (4 - matrix.length) / 2;
        drawMatrix(holdContext, matrix, {x: offsetX, y: offsetY});
    }
}

function merge(arena, player) {
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                arena[y + player.pos.y][x + player.pos.x] = value;
            }
        });
    });
}

// 落下処理
function playerDrop() {
    player.pos.y++;
    if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
    }
    dropCounter = 0;
}

// ハードドロップ機能
function playerHardDrop() {
    while (!collide(arena, player)) {
        player.pos.y++;
    }
    player.pos.y--; // 衝突する一歩手前に戻す
    merge(arena, player);
    playerReset();
    arenaSweep();
    updateScore();
    dropCounter = 0;
}

// ホールド機能
let holdPieceType = null;
let hasHeldThisTurn = false;

function playerHold() {
    if (hasHeldThisTurn) return; // 1ターンに2回以上はホールド不可

    const currentType = player.type;
    
    if (holdPieceType === null) {
        // 初めてのホールド：現在のブロックを格納し、次のブロックを生成
        holdPieceType = currentType;
        playerReset();
    } else {
        // 2回目以降：ホールド内のブロックと現在のブロックを入れ替える
        const temp = holdPieceType;
        holdPieceType = currentType;
        playerSetPiece(temp);
    }
    hasHeldThisTurn = true;
}

function playerMove(offset) {
    player.pos.x += offset;
    if (collide(arena, player)) {
        player.pos.x -= offset;
    }
}

// ブロックをセットする共通処理
function playerSetPiece(type) {
    player.type = type;
    player.matrix = createPiece(type);
    player.pos.y = 0;
    player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
}

// 次のブロック生成・ゲームリセット
function playerReset() {
    const pieces = 'TJLOSZI';
    const randomType = pieces[pieces.length * Math.random() | 0];
    playerSetPiece(randomType);
    hasHeldThisTurn = false; // ホールド制限を解除
    
    if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        holdPieceType = null;
        updateScore();
    }
}

function playerRotate(dir) {
    const pos = player.pos.x;
    let offset = 1;
    rotate(player.matrix, dir);
    while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
            rotate(player.matrix, -dir);
            player.pos.x = pos;
            return;
        }
    }
}

function rotate(matrix, dir) {
    for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
    }
    if (dir > 0) matrix.forEach(row => row.reverse());
    else matrix.reverse();
}

let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;

function update(time = 0) {
    const deltaTime = time - lastTime;
    dropCounter += deltaTime;
    if (dropCounter > dropInterval) {
        playerDrop();
    }
    lastTime = time;
    draw();
    requestAnimationFrame(update);
}

function updateScore() {
    document.getElementById('score').innerText = "SCORE: " + player.score;
}

const arena = createMatrix(12, 20);
const player = {
    pos: {x: 0, y: 0},
    matrix: null,
    type: null,
    score: 0,
};

// キーボード操作
document.addEventListener('keydown', event => {
    if (event.keyCode === 37) {
        playerMove(-1);       // ◀ 左移動
    } else if (event.keyCode === 39) {
        playerMove(1);        // ▶ 右移動
    } else if (event.keyCode === 40) {
        playerDrop();         // ▼ ソフトドロップ
    } else if (event.keyCode === 38) {
        playerRotate(1);      // ▲ 右回転
    } else if (event.keyCode === 32) {
        event.preventDefault(); // スペースキーでの画面スクロールを防止
        playerHardDrop();     // Space ハードドロップ
    } else if (event.keyCode === 16) {
        playerHold();         // Shift ホールド
    }
});

playerReset();
updateScore();
update();
</script>
</body>
</html>
